# Create the app at api.slack.com/apps -> "From an app manifest" -> paste this.
# Then: Basic Information -> App-Level Token with scope connections:write (this is SLACK_APP_TOKEN, xapp-...)
#       Install to workspace -> Bot User OAuth Token (SLACK_BOT_TOKEN, xoxb-...)
#       /invite @Embargo in #embargo
display_information:
  name: Embargo
  description: Export-control checks for outgoing drawings. Runs on a local box.
  background_color: "#0f1f3a"
features:
  bot_user:
    display_name: Embargo
    always_online: true
  slash_commands:
    - command: /gate
      description: Embargo (iam, send, sweep, verify, egress)
      usage_hint: "iam you@kestrelprecision.example | send <file> to <email> | sweep | verify"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - files:read
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
